<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100e13">
  <title>Last Shelter</title>
  <link rel="icon" type="image/svg+xml" href="/assets/art/shelter-mark.svg">
  <link rel="stylesheet" href="./src/styles/game.css">
  <link rel="stylesheet" href="./src/styles/interface.css">
  <link rel="stylesheet" href="./src/styles/visual-polish.css">
  <link rel="stylesheet" href="./src/styles/engine-ui.css">
  <link rel="stylesheet" href="./src/styles/route-map.css">
</head>
<body>
<main class="app" id="app">
    <header>
      <div class="brand">
        LAST SHELTER
      </div>
      <nav class="utility-nav" aria-label="게임 메뉴">
        <button class="menu-icon" id="bodyButton" type="button" aria-label="신체" aria-keyshortcuts="B" aria-describedby="bodyMenuTip"><kbd aria-hidden="true">B</kbd><span data-ui-icon="body"></span><span class="menu-tip" id="bodyMenuTip" role="tooltip"><strong>신체</strong><span>사지 상태와 부상 확인</span></span></button>
        <button class="menu-icon" id="inventoryButton" type="button" aria-label="인벤토리" aria-keyshortcuts="I" aria-describedby="inventoryMenuTip"><kbd aria-hidden="true">I</kbd><span data-ui-icon="backpack"></span><span class="menu-tip" id="inventoryMenuTip" role="tooltip"><strong>인벤토리</strong><span>현재 장비와 물자 확인</span></span></button>
        <button class="menu-icon" id="deckButton" type="button" aria-label="덱" aria-keyshortcuts="D" aria-describedby="deckMenuTip"><kbd aria-hidden="true">D</kbd><span data-ui-icon="cards"></span><span class="menu-tip" id="deckMenuTip" role="tooltip"><strong>덱</strong><span>보유 카드와 덱 구성</span></span></button>
        <button class="menu-icon" id="codexButton" type="button" aria-label="도감" aria-keyshortcuts="C" aria-describedby="codexMenuTip"><kbd aria-hidden="true">C</kbd><span data-ui-icon="codex"></span><span class="menu-tip" id="codexMenuTip" role="tooltip"><strong>도감</strong><span>카드와 장비 도감</span></span></button>
        <button class="menu-icon" id="logButton" type="button" aria-label="기록" aria-keyshortcuts="L" aria-describedby="logMenuTip"><kbd aria-hidden="true">L</kbd><span data-ui-icon="log"></span><span class="menu-tip" id="logMenuTip" role="tooltip"><strong>기록</strong><span>전투 기록 확인</span></span></button>
        <button class="menu-icon" id="helpButton" type="button" aria-label="규칙" aria-keyshortcuts="H" aria-describedby="helpMenuTip"><kbd aria-hidden="true">H</kbd><span data-ui-icon="help"></span><span class="menu-tip" id="helpMenuTip" role="tooltip"><strong>규칙</strong><span>조작법과 생존 규칙</span></span></button>
        <button class="menu-icon" id="settingsButton" type="button" aria-label="설정" aria-keyshortcuts="O" aria-describedby="settingsMenuTip"><kbd aria-hidden="true">O</kbd><span data-ui-icon="settings"></span><span class="menu-tip" id="settingsMenuTip" role="tooltip"><strong>설정</strong><span>소리와 연출 설정</span></span></button>
      </nav>
      <section class="status-bar" id="stats" aria-label="생존 상태"></section>
    </header>

    <section class="scene" id="scene">
      <canvas id="battle" aria-label="전투 화면. 하단 버튼으로 몸통과 사지를 선택할 수 있습니다."></canvas>
      <div class="heading">
        <div class="eyebrow">NOTHING HERE IS ENTIRELY DEAD</div>
        <h1 id="location"></h1>
      </div>
      <div class="phase" id="phase"></div>
      <div id="statuses"></div>
      <button class="button hero-button" id="heroButton">생존자 · 신체</button>
      <button class="button all-target" id="allTarget" hidden>적진 전체에 사용</button>
      <div class="targets" id="targets"></div>
      <div class="injury-banner" id="injuryBanner" role="status" aria-live="assertive"></div>
      <button class="card-pile draw-pile" id="drawPile" aria-label="뽑기 더미"></button>
      <button class="card-pile exhaust-pile" id="exhaustPile" aria-label="소멸 더미"></button>
      <button class="card-pile discard-pile" id="discardPile" aria-label="버림 더미"></button>
      <section class="command">
        <span id="selectionLabel"></span>
        <div class="row">
          <div id="piles"></div>
          <button class="button primary" id="endTurn">턴 종료 <kbd>Space</kbd></button>
        </div>
      </section>
      <section class="hand" id="hand" aria-label="손패"></section>
    </section>

    <footer>
      <span id="lastLog" role="status" aria-live="polite"></span>
      <span class="keys">1–9·0 카드 / Esc 취소 / M 음소거</span>
    </footer>
  </main>

  <aside class="preview" id="preview" aria-label="카드 효과 미리보기" hidden></aside>
  <aside class="tooltip" id="tooltip" role="tooltip" hidden></aside>

  <div class="overlay" id="overlay" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>
  <script type="module" src="./src/legacy/game.js"></script>
</body>
</html>
