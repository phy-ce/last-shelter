<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100e13">
  <title>LAST SHELTER — 육체의 잔향</title>
  <link rel="icon" type="image/svg+xml" href="/assets/art/shelter-mark.svg">
  <link rel="stylesheet" href="./src/styles/game.css">
  <link rel="stylesheet" href="./src/styles/interface.css">
  <link rel="stylesheet" href="./src/styles/visual-polish.css">
</head>
<body>
<main class="app" id="app">
    <header>
      <div class="brand">
        LAST SHELTER
        <small>육체의 잔향 / 생존 덱빌딩</small>
      </div>
      <nav class="utility-nav" aria-label="게임 메뉴">
        <button class="menu-icon" id="bodyButton" type="button" aria-label="신체" aria-keyshortcuts="B" aria-describedby="bodyMenuTip"><kbd aria-hidden="true">B</kbd><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4" r="2"/><path d="M5 9l7-2 7 2M12 7v7m0 0-4 7m4-7 4 7M8 8l-2 7m10-7 2 7"/></svg><span class="menu-tip" id="bodyMenuTip" role="tooltip"><strong>신체</strong><span>사지 상태와 부상 확인</span></span></button>
        <button class="menu-icon" id="deckButton" type="button" aria-label="덱" aria-keyshortcuts="D" aria-describedby="deckMenuTip"><kbd aria-hidden="true">D</kbd><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="6" width="12" height="15" rx="2"/><path d="M15 3H5a2 2 0 0 0-2 2v12m9-7v7m-3-4h6"/></svg><span class="menu-tip" id="deckMenuTip" role="tooltip"><strong>덱</strong><span>보유 카드와 덱 구성</span></span></button>
        <button class="menu-icon" id="codexButton" type="button" aria-label="도감" aria-keyshortcuts="C" aria-describedby="codexMenuTip"><kbd aria-hidden="true">C</kbd><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v16M12 5C8 2 4 3 2 4v15c4-2 7-1 10 2 3-3 6-4 10-2V4c-2-1-6-2-10 1Z"/></svg><span class="menu-tip" id="codexMenuTip" role="tooltip"><strong>도감</strong><span>카드와 장비 도감</span></span></button>
        <button class="menu-icon" id="logButton" type="button" aria-label="기록" aria-keyshortcuts="L" aria-describedby="logMenuTip"><kbd aria-hidden="true">L</kbd><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h4M3 7h3M3 12h3M3 17h3"/></svg><span class="menu-tip" id="logMenuTip" role="tooltip"><strong>기록</strong><span>전투 기록 확인</span></span></button>
        <button class="menu-icon" id="helpButton" type="button" aria-label="규칙" aria-keyshortcuts="H" aria-describedby="helpMenuTip"><kbd aria-hidden="true">H</kbd><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1 .6-1.5 1-1.5 3m0 3h.01"/></svg><span class="menu-tip" id="helpMenuTip" role="tooltip"><strong>규칙</strong><span>조작법과 생존 규칙</span></span></button>
        <button class="menu-icon" id="settingsButton" type="button" aria-label="설정" aria-keyshortcuts="O" aria-describedby="settingsMenuTip"><kbd aria-hidden="true">O</kbd><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg><span class="menu-tip" id="settingsMenuTip" role="tooltip"><strong>설정</strong><span>소리와 연출 설정</span></span></button>
      </nav>
      <section class="status-bar" id="stats" aria-label="생존 상태"></section>
    </header>

    <section class="scene" id="scene">
      <canvas id="battle" aria-label="전투 화면. 하단 버튼으로 몸통과 사지를 선택할 수 있습니다."></canvas>
      <div class="heading">
        <div class="eyebrow">NOTHING HERE IS ENTIRELY DEAD</div>
        <h1 id="location"></h1>
      </div>
      <div class="phase" id="phase"></div>
      <div id="statuses"></div>
      <button class="button hero-button" id="heroButton">생존자 · 신체</button>
      <button class="button all-target" id="allTarget" hidden>적진 전체에 사용</button>
      <div class="targets" id="targets"></div>
      <div class="injury-banner" id="injuryBanner" role="status" aria-live="assertive"></div>
      <button class="card-pile draw-pile" id="drawPile" aria-label="뽑기 더미"></button>
      <button class="card-pile exhaust-pile" id="exhaustPile" aria-label="소멸 더미"></button>
      <button class="card-pile discard-pile" id="discardPile" aria-label="버림 더미"></button>
      <section class="command">
        <span id="selectionLabel"></span>
        <div class="row">
          <div id="piles"></div>
          <button class="button primary" id="endTurn">턴 종료 <kbd>Space</kbd></button>
        </div>
      </section>
      <section class="hand" id="hand" aria-label="손패"></section>
    </section>

    <footer>
      <span id="lastLog" role="status" aria-live="polite"></span>
      <span class="keys">1–9·0 카드 / Esc 취소 / M 음소거</span>
    </footer>
  </main>

  <aside class="preview" id="preview" hidden></aside>
  <aside class="tooltip" id="tooltip" role="tooltip" hidden></aside>

  <div class="overlay" id="overlay" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>
  <script type="module" src="./src/legacy/game.js"></script>
</body>
</html>
